  <!-- set theme + language before first paint to avoid a flash -->
  <script>
    (function () {
      document.documentElement.classList.add("js");
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        // English by default; Persian only when the visitor picked it (or ?lang=fa)
        var l = new URLSearchParams(location.search).get("lang") || localStorage.getItem("lang");
        if (l === "fa") { document.documentElement.lang = "fa"; document.documentElement.dir = "rtl"; }
      } catch (e) {}
    })();
  </script>
